# Copy to samconfig.toml (gitignored) and fill in the parameter values.
# Then `sam deploy` reads these automatically — no need to pass flags each time.
version = 0.1

[default.deploy.parameters]
stack_name = "uchino-kakebo-api"
region = "ap-northeast-1"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = """SupabaseUrl=\"https://xxxx.supabase.co\" \
SupabaseServiceRoleKey=\"your-service-role-key\" \
UserId=\"your-supabase-user-uuid\""""
